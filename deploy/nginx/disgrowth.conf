# Origin TLS sits behind Cloudflare (Full / Full Strict). Apply as the
# disgrowth.net server block. HTTP must redirect; never proxy :80 to Node
# with a fake X-Forwarded-Proto https.

map $http_cf_connecting_ip $true_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name disgrowth.net www.disgrowth.net;
    server_tokens off;
    return 301 https://disgrowth.net$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name disgrowth.net;
    server_tokens off;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $true_client_ip;
        proxy_set_header X-Forwarded-For   $true_client_ip;
        proxy_set_header CF-Connecting-IP  $true_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header X-Powered-By;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
